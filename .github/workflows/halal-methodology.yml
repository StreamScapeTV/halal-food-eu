name: Halal methodology analysis

on:
  workflow_call:
    inputs:
      source_key:
        required: true
        type: string
      snapshot_id:
        required: true
        type: string
      normalized_artifact_name:
        required: true
        type: string
      quality_artifact_name:
        required: true
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.methodology.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  methodology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.name.outputs.artifact_name }}
    steps:
      - name: Check out trusted methodology without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download normalized evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.normalized_artifact_name }}
          path: ${{ runner.temp }}/normalized

      - name: Download quality report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.quality_artifact_name }}
          path: ${{ runner.temp }}/quality

      - name: Validate trusted inputs and methodology
        run: |
          set -euo pipefail
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/normalized/handoff.json" \
            --consumer-stage build \
            --payload-root "$RUNNER_TEMP/normalized"
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/quality/handoff.json" \
            --consumer-stage build \
            --payload-root "$RUNNER_TEMP/quality"
          python3 Tools/evidence_model.py validate \
            --input "$RUNNER_TEMP/normalized/payload/evidence.json"
          python3 Tools/halal_methodology.py validate

      - name: Produce deterministic candidate and review-queue report
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/methodology"
          python3 Tools/halal_methodology.py analyze-envelope \
            --evidence "$RUNNER_TEMP/normalized/payload/evidence.json" \
            --quality-report "$RUNNER_TEMP/quality/payload/quality-report.json" \
            --output "$RUNNER_TEMP/methodology/methodology-report.json"
          MIGRATION_OCCURRED_AT="$(git show -s --format=%cI "$GITHUB_SHA")"
          python3 Tools/halal_methodology.py migrate \
            --evidence "$RUNNER_TEMP/normalized/payload/evidence.json" \
            --occurred-at "$MIGRATION_OCCURRED_AT" \
            --output "$RUNNER_TEMP/methodology/methodology-migration.json"

      - name: Define artifact name
        id: name
        env:
          SOURCE_KEY: ${{ inputs.source_key }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: echo "artifact_name=methodology-${SOURCE_KEY}-${SNAPSHOT_ID}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload candidate, review-queue, and migration reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ runner.temp }}/methodology
          if-no-files-found: error
          retention-days: 1
