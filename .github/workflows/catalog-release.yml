name: Catalog release evidence

on:
  push:
    branches: [main]
    paths:
      - "Data/catalog/production-catalog-release-input-v1.json"
      - "Data/catalog/bundle-source-manifest-v1.schema.json"
      - "Data/catalog/bundled/de/**"
      - "Data/refresh/accepted-open-food-facts-v1.json"
      - "Data/refresh/accepted-open-prices-v1.json"
      - "Data/quality/catalog-quality-policy-v1.json"
      - "Data/sources/open-food-facts/source-policy-v1.json"
      - "Data/sources/open-prices/source-policy-v1.json"
      - "Data/workflows/**"
      - "HalalFoodEU/Resources/catalog.sqlite3"
      - "HalalFoodEU/Resources/catalog-manifest.json"
      - "Tools/catalog_builder.py"
      - "Tools/build_bundled_catalog.py"
      - "Tools/catalog_source_shards.py"
      - "Tools/catalog_refresh_operational_state.py"
      - "Tools/catalog_security.py"
      - "Tools/catalog_workflow.py"
      - "Tools/production_catalog.py"
      - "Tools/product_search_index.py"
      - "Tools/production_catalog_aggregate.py"
      - "Tools/production_catalog_logical.py"
      - "Tools/production_catalog_manifest_review.py"
      - "Tools/production_catalog_release_input.py"
      - "Tools/production_catalog_release_notes.py"
      - "Tools/production_catalog_request.py"
      - "Tools/validate_catalog.py"
      - ".github/workflows/catalog-release.yml"
  workflow_dispatch:
    inputs:
      attest:
        description: Create GitHub provenance attestations for the integrated catalog artifacts.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require integrated main ref
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - name: Check out integrated main without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve exact integrated release mode
        id: mode
        run: |
          set -euo pipefail
          RECEIPT=Data/catalog/production-catalog-release-input-v1.json
          BUNDLE_MANIFEST=Data/catalog/bundled/de/source-manifest-v1.json
          if [[ -f "$RECEIPT" ]]; then
            python3 Tools/production_catalog_release_input.py validate --input "$RECEIPT"
            RECEIPT="$RECEIPT" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path

          receipt = json.loads(Path(os.environ['RECEIPT']).read_text(encoding='utf-8'))
          print('production=true')
          print('production_mode=receipt')
          print(f"source_key={receipt['sourceKey']}")
          print(f"snapshot_id={receipt['snapshotId']}")
          print(f"catalog_version={receipt['catalogVersion']}")
          print(f"source_run_id={receipt['sourceRunId']}")
          print(f"normalized_artifact_name={receipt['inputs']['normalizedEvidence']['artifactName']}")
          print(f"quality_artifact_name={receipt['inputs']['qualityReport']['artifactName']}")
          print(f"basic_exclusions_artifact_name={receipt['inputs']['basicExclusions']['artifactName']}")
          PY
          elif [[ -f "$BUNDLE_MANIFEST" ]]; then
            PYTHONPATH=Tools python3 Tools/catalog_source_shards.py validate --manifest "$BUNDLE_MANIFEST"
            BUNDLE_MANIFEST="$BUNDLE_MANIFEST" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path

          manifest = json.loads(Path(os.environ['BUNDLE_MANIFEST']).read_text(encoding='utf-8'))
          print('production=true')
          print('production_mode=git-bundle')
          print('source_key=aggregate')
          print(f"snapshot_id={manifest['datasetID']}")
          print(f"catalog_version={manifest['catalogVersion']}")
          PY
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "production_mode=synthetic" >> "$GITHUB_OUTPUT"
            echo "source_key=synthetic-fixture" >> "$GITHUB_OUTPUT"
            echo "snapshot_id=main-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
            echo "catalog_version=0.0.0-demo.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate protected main accepted refresh checkpoints
        if: steps.mode.outputs.production_mode == 'receipt'
        run: |
          set -euo pipefail
          python3 Tools/catalog_refresh_operational_state.py validate-state \
            --input Data/refresh/accepted-open-food-facts-v1.json
          python3 Tools/catalog_refresh_operational_state.py validate-state \
            --input Data/refresh/accepted-open-prices-v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = {
              'open-food-facts': Path('Data/refresh/accepted-open-food-facts-v1.json'),
              'open-prices': Path('Data/refresh/accepted-open-prices-v1.json'),
          }
          for source_key, path in paths.items():
              state = json.loads(path.read_text(encoding='utf-8'))
              if state.get('sourceKey') != source_key or state.get('market') != 'DE':
                  raise SystemExit(f'post-merge accepted refresh state identity mismatch for {source_key}')
              if state.get('candidateComplete') is not None:
                  raise SystemExit(f'post-merge accepted refresh state still contains a candidate for {source_key}')
              if state.get('candidateEligible') is not False or state.get('candidateChangedFromAccepted') is not False:
                  raise SystemExit(f'post-merge accepted refresh state has unpromoted candidate flags for {source_key}')
              accepted = state.get('acceptedComplete')
              if accepted is not None and accepted.get('status') != 'complete':
                  raise SystemExit(f'post-merge accepted refresh state is not complete for {source_key}')
          PY

      - name: Download reviewed normalized evidence
        if: steps.mode.outputs.production_mode == 'receipt'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.mode.outputs.normalized_artifact_name }}
          path: ${{ runner.temp }}/release-root/normalized
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.mode.outputs.source_run_id }}

      - name: Download reviewed quality report
        if: steps.mode.outputs.production_mode == 'receipt'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.mode.outputs.quality_artifact_name }}
          path: ${{ runner.temp }}/release-root/quality
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.mode.outputs.source_run_id }}

      - name: Download reviewed basic exclusions
        if: steps.mode.outputs.production_mode == 'receipt'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.mode.outputs.basic_exclusions_artifact_name }}
          path: ${{ runner.temp }}/release-root/basic-exclusions
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.mode.outputs.source_run_id }}

      - name: Materialize production catalog from reviewed immutable inputs
        if: steps.mode.outputs.production_mode == 'receipt'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/release-root"
          mkdir -p \
            "$ROOT/repository/Data/quality" \
            "$ROOT/repository/Data/sources/open-food-facts" \
            "$ROOT/repository/Data/sources/open-prices" \
            "$ROOT/database/payload" \
            "$ROOT/manifest/payload" \
            "$ROOT/release-notes/payload"
          cp Data/quality/catalog-quality-policy-v1.json \
            "$ROOT/repository/Data/quality/catalog-quality-policy-v1.json"
          cp Data/sources/open-food-facts/source-policy-v1.json \
            "$ROOT/repository/Data/sources/open-food-facts/source-policy-v1.json"
          cp Data/sources/open-prices/source-policy-v1.json \
            "$ROOT/repository/Data/sources/open-prices/source-policy-v1.json"
          python3 Tools/production_catalog_release_input.py materialize-request \
            --input Data/catalog/production-catalog-release-input-v1.json \
            --normalized-handoff "$ROOT/normalized/handoff.json" \
            --normalized-root "$ROOT/normalized" \
            --quality-handoff "$ROOT/quality/handoff.json" \
            --quality-root "$ROOT/quality" \
            --basic-exclusions-handoff "$ROOT/basic-exclusions/handoff.json" \
            --basic-exclusions-root "$ROOT/basic-exclusions" \
            --integrated-source-commit "$GITHUB_SHA" \
            --workflow-run "github:${GITHUB_RUN_ID}:attempt:${GITHUB_RUN_ATTEMPT}" \
            --output "$ROOT/production-build-request.json"
          ROOT="$ROOT" python3 - <<'PY'
          import json, os
          from pathlib import Path

          request_path = Path(os.environ['ROOT']) / 'production-build-request.json'
          request = json.loads(request_path.read_text(encoding='utf-8'))
          request['releaseNotesOutputPath'] = 'release-notes/payload/catalog-release-notes.md'
          request_path.write_text(json.dumps(request, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python3 Tools/production_catalog_request.py validate \
            --request "$ROOT/production-build-request.json" \
            --root "$ROOT"
          python3 Tools/production_catalog_request.py build \
            --request "$ROOT/production-build-request.json" \
            --root "$ROOT" \
            --workflow-contract Data/workflows/catalog-workflow-contract-v1.json
          python3 Tools/production_catalog.py validate \
            --database "$ROOT/database/payload/catalog.sqlite3" \
            --manifest "$ROOT/manifest/payload/catalog-manifest.json"
          python3 Tools/production_catalog_release_notes.py \
            --release-notes "$ROOT/release-notes/payload/catalog-release-notes.md" \
            --manifest "$ROOT/manifest/payload/catalog-manifest.json" \
            --quality-report "$ROOT/quality/payload/quality-report.json"
          python3 Tools/production_catalog_manifest_review.py \
            --manifest "$ROOT/manifest/payload/catalog-manifest.json" \
            --quality-report "$ROOT/quality/payload/quality-report.json"
          python3 Tools/production_catalog.py validate \
            --database "$ROOT/database/payload/catalog.sqlite3" \
            --manifest "$ROOT/manifest/payload/catalog-manifest.json"
          ROOT="$ROOT" python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          receipt = json.loads(Path('Data/catalog/production-catalog-release-input-v1.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest/payload/catalog-manifest.json').read_text(encoding='utf-8'))
          expected = {
              'catalogVersion': receipt['catalogVersion'],
              'selectionPolicyVersion': receipt['selectionPolicyVersion'],
              'sourceCommit': os.environ['GITHUB_SHA'],
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'post-merge manifest {key} differs from reviewed release lineage')
          if not isinstance(manifest.get('releaseReview'), dict):
              raise SystemExit('post-merge manifest is missing releaseReview metadata')
          release_notes = (root / 'release-notes/payload/catalog-release-notes.md').read_text(encoding='utf-8')
          if '## HF-PIPELINE-010 release summary' not in release_notes:
              raise SystemExit('post-merge production release notes are missing the formal release summary')
          PY

      - name: Materialize Git-backed production catalog
        if: steps.mode.outputs.production_mode == 'git-bundle'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/release-root"
          BUNDLE_MANIFEST=Data/catalog/bundled/de/source-manifest-v1.json
          mkdir -p "$ROOT/database/payload" "$ROOT/manifest/payload" "$ROOT/release-notes/payload"
          PYTHONPATH=Tools python3 Tools/catalog_source_shards.py validate             --manifest "$BUNDLE_MANIFEST"
          PYTHONPATH=Tools python3 Tools/build_bundled_catalog.py             --source-manifest "$BUNDLE_MANIFEST"             --database "$ROOT/database/payload/catalog.sqlite3"             --manifest "$ROOT/manifest/payload/catalog-manifest.json"             --source-commit "$GITHUB_SHA"             --workflow-run "github:${GITHUB_RUN_ID}:attempt:${GITHUB_RUN_ATTEMPT}"
          python3 Tools/production_catalog.py validate             --database "$ROOT/database/payload/catalog.sqlite3"             --manifest "$ROOT/manifest/payload/catalog-manifest.json"
          python3 Tools/product_search_index.py validate             --database "$ROOT/database/payload/catalog.sqlite3"             --manifest "$ROOT/manifest/payload/catalog-manifest.json"
          ROOT="$ROOT" BUNDLE_MANIFEST="$BUNDLE_MANIFEST" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          source_path = Path(os.environ['BUNDLE_MANIFEST'])
          source = json.loads(source_path.read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest/payload/catalog-manifest.json').read_text(encoding='utf-8'))
          shard_set = manifest.get('sourceShardSet')
          expected = {
              'schemaVersion': source['schemaVersion'],
              'datasetID': source['datasetID'],
              'manifestPath': source_path.as_posix(),
              'manifestSha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
              'logicalSha256': source['logicalSha256'],
              'recordCount': source['recordCount'],
              'shardCount': len(source['shards']),
          }
          if shard_set != expected:
              raise SystemExit('Git-backed production manifest sourceShardSet differs from committed source manifest')
          if manifest.get('catalogVersion') != source['catalogVersion']:
              raise SystemExit('Git-backed production manifest catalogVersion differs from committed source manifest')
          notes = [
              '# Halal Food EU catalog release',
              '',
              '## Git-backed production baseline',
              '',
              f"- catalogVersion: {source['catalogVersion']}",
              f"- datasetID: {source['datasetID']}",
              f"- recordCount: {source['recordCount']}",
              f"- logicalSha256: {source['logicalSha256']}",
              f"- sourceCommit: {manifest['sourceCommit']}",
              '',
              'This release materializes the rights-reviewed Git-backed Germany source set defined by specification 030.',
          ]
          (root / 'release-notes/payload/catalog-release-notes.md').write_text('\n'.join(notes) + '\n', encoding='utf-8')
          PY

      - name: Materialize deterministic synthetic fallback
        if: steps.mode.outputs.production != 'true'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/release-root"
          mkdir -p "$ROOT/database/payload" "$ROOT/manifest/payload"
          python3 Tools/catalog_builder.py \
            --input Data/sample-products.json \
            --database "$ROOT/database/payload/catalog.sqlite3" \
            --manifest "$ROOT/manifest/payload/catalog-manifest.json"
          python3 Tools/catalog_security.py bind-manifest \
            --manifest "$ROOT/manifest/payload/catalog-manifest.json" \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json
          python3 Tools/validate_catalog.py \
            --database "$ROOT/database/payload/catalog.sqlite3" \
            --manifest "$ROOT/manifest/payload/catalog-manifest.json" \
            --source Data/sample-products.json
          python3 Tools/catalog_security.py validate-manifest \
            --manifest "$ROOT/manifest/payload/catalog-manifest.json" \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json

      - name: Validate workflow contract after exact rematerialization
        run: |
          set -euo pipefail
          python3 Tools/catalog_workflow.py validate-contract

      - name: Emit post-merge checksum and lineage report
        env:
          PRODUCTION: ${{ steps.mode.outputs.production }}
          PRODUCTION_MODE: ${{ steps.mode.outputs.production_mode }}
          SOURCE_KEY: ${{ steps.mode.outputs.source_key }}
          SNAPSHOT_ID: ${{ steps.mode.outputs.snapshot_id }}
          CATALOG_VERSION: ${{ steps.mode.outputs.catalog_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-root/release/payload"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'release-root'
          database = root / 'database/payload/catalog.sqlite3'
          manifest = root / 'manifest/payload/catalog-manifest.json'
          report = {
              'schemaVersion': 1,
              'commitSha': os.environ['GITHUB_SHA'],
              'releaseMode': 'production' if os.environ['PRODUCTION'] == 'true' else 'synthetic-fixture',
              'sourceKey': os.environ['SOURCE_KEY'],
              'snapshotId': os.environ['SNAPSHOT_ID'],
              'catalogVersion': os.environ['CATALOG_VERSION'],
              'databaseSha256': hashlib.sha256(database.read_bytes()).hexdigest(),
              'manifestSha256': hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'appStoreSigningPerformed': False,
              'remoteCatalogPublicationPerformed': False,
          }
          manifest_data = json.loads(manifest.read_text(encoding='utf-8'))
          production_mode = os.environ['PRODUCTION_MODE']
          report['productionAuthority'] = production_mode
          if manifest_data.get('catalogVersion') != os.environ['CATALOG_VERSION']:
              raise SystemExit('release report catalogVersion differs from materialized manifest')
          receipt_path = Path('Data/catalog/production-catalog-release-input-v1.json')
          if os.environ['PRODUCTION'] == 'true' and production_mode == 'receipt':
              receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
              release_notes = root / 'release-notes/payload/catalog-release-notes.md'
              report['reviewedSourceCommit'] = receipt['reviewedSourceCommit']
              report['reviewedSourceRunId'] = receipt['sourceRunId']
              report['proposedCatalogSha256'] = receipt['proposedCatalogSha256']
              report['proposedManifestSha256'] = receipt['proposedManifestSha256']
              report['releaseNotesSha256'] = hashlib.sha256(release_notes.read_bytes()).hexdigest()
          elif os.environ['PRODUCTION'] == 'true' and production_mode == 'git-bundle':
              source_path = Path('Data/catalog/bundled/de/source-manifest-v1.json')
              source = json.loads(source_path.read_text(encoding='utf-8'))
              shard_set = manifest_data.get('sourceShardSet')
              if not isinstance(shard_set, dict):
                  raise SystemExit('Git-backed production release manifest is missing sourceShardSet')
              report['sourceShardSet'] = shard_set
              report['sourceSetManifestSha256'] = hashlib.sha256(source_path.read_bytes()).hexdigest()
              report['sourceSetLogicalSha256'] = source['logicalSha256']
              report['sourceSetRecordCount'] = source['recordCount']
              report['sourceSetShardCount'] = len(source['shards'])
              release_notes = root / 'release-notes/payload/catalog-release-notes.md'
              report['releaseNotesSha256'] = hashlib.sha256(release_notes.read_bytes()).hexdigest()
          else:
              report['sourcePolicy'] = manifest_data['sourcePolicy']
          (root / 'release/payload/release-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          python3 Tools/catalog_workflow.py emit-handoff \
            --artifact-kind release-report \
            --source-key "$SOURCE_KEY" \
            --snapshot-id "$SNAPSHOT_ID" \
            --producer-commit "$GITHUB_SHA" \
            --producer-workflow catalog-release.yml \
            --run-id "$GITHUB_RUN_ID" \
            --payload "$RUNNER_TEMP/release-root/release/payload/release-report.json" \
            --payload-relative-path payload/release-report.json \
            --record-count 1 \
            --completeness complete \
            --redistribution-class metadata-only \
            --content-schema-version release-report-v1 \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/release-root/release/handoff.json"

      - name: Upload exact integrated release evidence and attestation subjects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-root/database
            ${{ runner.temp }}/release-root/manifest
            ${{ runner.temp }}/release-root/release-notes
            ${{ runner.temp }}/release-root/release
          if-no-files-found: error
          retention-days: 90

  attestation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.attest && github.ref == 'refs/heads/main' }}
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact integrated main without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the exact subjects validated by release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence

      - name: Revalidate exact attestation subjects
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/release-evidence"
          MODE="$(python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'release-evidence'
          report = json.loads((root / 'release/payload/release-report.json').read_text(encoding='utf-8'))
          if report.get('commitSha') != os.environ['GITHUB_SHA']:
              raise SystemExit('release evidence commit differs from attestation commit')
          subjects = {
              'databaseSha256': root / 'database/payload/catalog.sqlite3',
              'manifestSha256': root / 'manifest/payload/catalog-manifest.json',
          }
          for key, path in subjects.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if report.get(key) != actual:
                  raise SystemExit(f'release evidence {key} differs from attestation subject')
          print(report['releaseMode'])
          PY
          )"
          if [[ "$MODE" == "production" ]]; then
            python3 Tools/production_catalog.py validate \
              --database "$ROOT/database/payload/catalog.sqlite3" \
              --manifest "$ROOT/manifest/payload/catalog-manifest.json"
          else
            python3 Tools/validate_catalog.py \
              --database "$ROOT/database/payload/catalog.sqlite3" \
              --manifest "$ROOT/manifest/payload/catalog-manifest.json" \
              --source Data/sample-products.json
            python3 Tools/catalog_security.py validate-manifest \
              --manifest "$ROOT/manifest/payload/catalog-manifest.json" \
              --source-policy Data/workflows/catalog-workflow-contract-v1.json
          fi

      - name: Attest integrated catalog provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/release-evidence/database/payload/catalog.sqlite3
            ${{ runner.temp }}/release-evidence/manifest/payload/catalog-manifest.json
