name: Governance Check

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.json"
      - ".github/workflows/governance-check.yml"
      - ".github/workflows/label-sync.yml"
      - "Tools/github_governance.py"
      - "Tools/validate_issue_forms.rb"
      - "Tools/tests/test_github_governance.py"
      - "docs/governance/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile governance Python
        run: python3 -m py_compile Tools/github_governance.py Tools/tests/test_github_governance.py
      - name: Validate managed label manifest
        run: python3 Tools/github_governance.py validate-manifest
      - name: Validate issue forms
        run: ruby Tools/validate_issue_forms.rb
      - name: Run governance unit tests
        run: python3 -m unittest discover -s Tools/tests -p 'test_github_governance.py'

  live-roadmap-validation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out trusted default-branch code without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate issue priority and status taxonomy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Tools/github_governance.py validate-roadmap
