name: iOS CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate immutable evidence contract
        run: |
          python3 -m py_compile \
            Tools/evidence_model.py \
            Tools/evidence_model_core.py \
            Tools/tests/test_evidence_model.py \
            Tools/tests/test_evidence_source_market.py
          python3 -m json.tool Data/evidence/evidence-envelope-v1.schema.json >/dev/null
          python3 Tools/evidence_model.py validate \
            --input Data/evidence/sample-evidence-v1.json
          python3 Tools/evidence_model.py project \
            --input Data/evidence/sample-evidence-v1.json \
            --output "$RUNNER_TEMP/runtime-projection.json"
          python3 -m unittest discover -s Tools/tests -p 'test_evidence*.py'

      - name: Validate Germany catalog selection policy
        run: |
          python3 -m py_compile \
            Tools/catalog_selection.py \
            Tools/catalog_selection_contract.py \
            Tools/catalog_selection_engine.py \
            Tools/tests/test_catalog_selection.py
          python3 -m json.tool Data/selection/catalog-selection-policy-v1.schema.json >/dev/null
          python3 -m json.tool Data/selection/selection-candidates-v1.schema.json >/dev/null
          python3 Tools/catalog_selection.py validate \
            --policy Data/selection/catalog-selection-policy-v1.json \
            --input Data/selection/sample-selection-candidates-v1.json
          python3 Tools/catalog_selection.py evaluate \
            --policy Data/selection/catalog-selection-policy-v1.json \
            --input Data/selection/sample-selection-candidates-v1.json \
            --output "$RUNNER_TEMP/catalog-selection.json"
          python3 -m unittest discover -s Tools/tests -p 'test_catalog_selection.py'

      - name: Validate Open Food Facts source adapter
        run: |
          python3 -m py_compile \
            Tools/open_food_facts.py \
            Tools/open_food_facts_common.py \
            Tools/open_food_facts_acquire.py \
            Tools/open_food_facts_normalize.py \
            Tools/tests/test_open_food_facts.py \
            Tools/tests/test_open_food_facts_schema.py
          python3 -m json.tool Data/sources/open-food-facts/source-policy-v1.json >/dev/null
          python3 -m unittest discover -s Tools/tests -p 'test_open_food_facts*.py'

      - name: Validate catalog workflow contract and trust boundaries
        run: |
          python3 -m py_compile \
            Tools/catalog_workflow.py \
            Tools/catalog_workflow_common.py \
            Tools/catalog_workflow_contract.py \
            Tools/catalog_workflow_fixture.py \
            Tools/catalog_workflow_handoff.py \
            Tools/catalog_workflow_policy.py \
            Tools/tests/test_catalog_workflow.py
          python3 -m json.tool Data/workflows/catalog-workflow-contract-v1.json >/dev/null
          python3 -m json.tool Data/workflows/workflow-handoff-v1.schema.json >/dev/null
          python3 Tools/catalog_workflow.py validate-contract
          python3 Tools/catalog_workflow.py validate-handoff \
            --input Data/workflows/sample-workflow-handoff-v1.json \
            --consumer-stage normalize-diff \
            --payload-root .
          python3 Tools/catalog_workflow.py validate-synthetic-normalization \
            --source Data/workflows/synthetic-source-records.jsonl \
            --evidence Data/evidence/sample-evidence-v1.json
          python3 Tools/catalog_workflow.py materialize-fixture-builder-input \
            --evidence Data/evidence/sample-evidence-v1.json \
            --output "$RUNNER_TEMP/workflow-builder-input.json"
          python3 Tools/catalog_workflow.py validate-workflows --root .github/workflows
          python3 -m unittest discover -s Tools/tests -p 'test_catalog_workflow.py'

      - name: Validate hostile-input and dependency security policy
        run: |
          python3 -m py_compile \
            Tools/catalog_security.py \
            Tools/tests/test_catalog_security.py
          python3 -m json.tool Data/security/tooling-dependencies-v1.json >/dev/null
          python3 -m unittest discover -s Tools/tests -p 'test_catalog_security.py'
          python3 Tools/catalog_security.py tooling-sbom \
            --root . \
            --dependency-manifest Data/security/tooling-dependencies-v1.json \
            --output "$RUNNER_TEMP/tooling-sbom.json"
          python3 -m json.tool "$RUNNER_TEMP/tooling-sbom.json" >/dev/null

      - name: Upload reviewed tooling SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tooling-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/tooling-sbom.json
          if-no-files-found: error
          retention-days: 14

      - name: Build synthetic SQLite catalog
        run: |
          python3 Tools/catalog_builder.py \
            --input Data/sample-products.json \
            --database HalalFoodEU/Resources/catalog.sqlite3 \
            --manifest HalalFoodEU/Resources/catalog-manifest.json
          python3 Tools/catalog_security.py bind-manifest \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json

      - name: Validate bundled SQLite catalog and source-policy binding
        run: |
          python3 Tools/validate_catalog.py \
            --database HalalFoodEU/Resources/catalog.sqlite3 \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source Data/sample-products.json
          python3 Tools/catalog_security.py validate-manifest \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json

      - name: Rebuild and compare logical catalog content
        run: |
          mkdir -p "$RUNNER_TEMP/rebuilt"
          python3 Tools/catalog_builder.py \
            --input Data/sample-products.json \
            --database "$RUNNER_TEMP/rebuilt/catalog.sqlite3" \
            --manifest "$RUNNER_TEMP/rebuilt/catalog-manifest.json"
          python3 Tools/catalog_security.py bind-manifest \
            --manifest "$RUNNER_TEMP/rebuilt/catalog-manifest.json" \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json
          python3 Tools/validate_catalog.py \
            --database "$RUNNER_TEMP/rebuilt/catalog.sqlite3" \
            --manifest "$RUNNER_TEMP/rebuilt/catalog-manifest.json" \
            --source Data/sample-products.json
          python3 Tools/catalog_security.py validate-manifest \
            --manifest "$RUNNER_TEMP/rebuilt/catalog-manifest.json" \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json

  ios:
    name: iOS 18+ build and tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_COMMIT: 8445e778451c7e44237b90281bde622d764b0084
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build reviewed XcodeGen source pin
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/XcodeGen" "$RUNNER_TEMP/bin"
          git -C "$RUNNER_TEMP/XcodeGen" init
          git -C "$RUNNER_TEMP/XcodeGen" remote add origin https://github.com/yonaskolb/XcodeGen.git
          git -C "$RUNNER_TEMP/XcodeGen" fetch --depth=1 origin "$XCODEGEN_COMMIT"
          test "$(git -C "$RUNNER_TEMP/XcodeGen" rev-parse FETCH_HEAD)" = "$XCODEGEN_COMMIT"
          git -C "$RUNNER_TEMP/XcodeGen" checkout --detach FETCH_HEAD
          test -f "$RUNNER_TEMP/XcodeGen/Package.resolved"
          (
            cd "$RUNNER_TEMP/XcodeGen"
            swift build -c release --disable-sandbox
          )
          cp "$RUNNER_TEMP/XcodeGen/.build/release/xcodegen" "$RUNNER_TEMP/bin/xcodegen"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Generate, build, and test
        run: ./Scripts/ci-ios.sh
