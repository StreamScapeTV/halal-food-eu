name: Label Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - "Tools/github_governance.py"
      - ".github/workflows/label-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: label-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate manifest
        run: python3 Tools/github_governance.py validate-manifest
      - name: Synchronize managed labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Tools/github_governance.py sync-labels
      - name: Validate issue taxonomy after synchronization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Tools/github_governance.py validate-roadmap
