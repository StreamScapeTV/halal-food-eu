name: Scheduled catalog refresh
run-name: Catalog refresh ${{ github.event_name == 'schedule' && github.event.schedule == '41 3 * * 5' && 'open-prices' || github.event_name == 'schedule' && 'open-food-facts' || inputs.source_key }}

on:
  schedule:
    - cron: "17 3 * * 3"
    - cron: "41 3 * * 5"
  workflow_dispatch:
    inputs:
      source_key:
        description: Registered source key.
        required: true
        default: open-food-facts
        type: string
      snapshot_id:
        description: Immutable source snapshot identifier.
        required: true
        default: off-manual-fixture
        type: string
      mode:
        description: Registered acquisition mode.
        required: true
        default: fixture
        type: choice
        options: [fixture, sample, full]
      catalog_version:
        description: Production semantic catalog version. Required only for a manual full Open Food Facts proposal; Open Prices is paired automatically.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: catalog-refresh-${{ inputs.source_key || 'scheduled' }}
  cancel-in-progress: false

jobs:
  trusted-default-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      source_key: ${{ steps.resolve.outputs.source_key }}
      snapshot_id: ${{ steps.resolve.outputs.snapshot_id }}
      mode: ${{ steps.resolve.outputs.mode }}
      catalog_version: ${{ steps.resolve.outputs.catalog_version }}
      proposal_enabled: ${{ steps.resolve.outputs.proposal_enabled }}
      production_aggregate_enabled: ${{ steps.resolve.outputs.production_aggregate_enabled }}
      retailer_snapshot_id: ${{ steps.resolve.outputs.retailer_snapshot_id }}
    steps:
      - name: Require reviewed default-branch workflow code
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - name: Resolve bounded scheduled or manual source inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SOURCE_KEY: ${{ inputs.source_key }}
          INPUT_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CATALOG_VERSION: ${{ inputs.catalog_version }}
        run: |
          set -euo pipefail
          SOURCE_KEY=""
          SNAPSHOT_ID=""
          MODE=""
          CATALOG_VERSION=""
          PROPOSAL_ENABLED=false
          PRODUCTION_AGGREGATE_ENABLED=false
          RETAILER_SNAPSHOT_ID=""

          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "41 3 * * 5" ]]; then
            SOURCE_KEY=open-prices
            SNAPSHOT_ID="op-scheduled-${GITHUB_RUN_ID}"
            MODE=full
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            SOURCE_KEY=open-food-facts
            SNAPSHOT_ID="off-scheduled-${GITHUB_RUN_ID}"
            MODE=full
          else
            SOURCE_KEY="$INPUT_SOURCE_KEY"
            SNAPSHOT_ID="$INPUT_SNAPSHOT_ID"
            MODE="$INPUT_MODE"
          fi

          if [[ "$SOURCE_KEY" == "synthetic-fixture" && "$MODE" != "sample" ]]; then
            CATALOG_VERSION=0.0.0-demo.1
            PROPOSAL_ENABLED=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$SOURCE_KEY" == "open-food-facts" && "$MODE" == "full" && -n "$INPUT_CATALOG_VERSION" ]]; then
            CATALOG_VERSION="$INPUT_CATALOG_VERSION"
            CATALOG_VERSION="$CATALOG_VERSION" python3 - <<'PY'
          import os, re
          version = os.environ['CATALOG_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('catalog_version must be a production semantic version without a prerelease suffix')
          PY
            PROPOSAL_ENABLED=true
            PRODUCTION_AGGREGATE_ENABLED=true
            RETAILER_SNAPSHOT_ID="op-production-${GITHUB_RUN_ID}"
          fi

          echo "source_key=$SOURCE_KEY" >> "$GITHUB_OUTPUT"
          echo "snapshot_id=$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "catalog_version=$CATALOG_VERSION" >> "$GITHUB_OUTPUT"
          echo "proposal_enabled=$PROPOSAL_ENABLED" >> "$GITHUB_OUTPUT"
          echo "production_aggregate_enabled=$PRODUCTION_AGGREGATE_ENABLED" >> "$GITHUB_OUTPUT"
          echo "retailer_snapshot_id=$RETAILER_SNAPSHOT_ID" >> "$GITHUB_OUTPUT"

  policy:
    needs: trusted-default-branch
    uses: ./.github/workflows/source-policy.yml
    with:
      source_key: ${{ needs.trusted-default-branch.outputs.source_key }}
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      mode: ${{ needs.trusted-default-branch.outputs.mode }}

  acquire:
    needs: [trusted-default-branch, policy]
    uses: ./.github/workflows/acquire-catalog.yml
    with:
      source_key: ${{ needs.trusted-default-branch.outputs.source_key }}
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      mode: ${{ needs.trusted-default-branch.outputs.mode }}
      policy_artifact_name: ${{ needs.policy.outputs.artifact_name }}

  normalize:
    needs: [trusted-default-branch, acquire]
    uses: ./.github/workflows/normalize-and-diff.yml
    with:
      source_key: ${{ needs.trusted-default-branch.outputs.source_key }}
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      source_artifact_name: ${{ needs.acquire.outputs.artifact_name }}

  quality:
    if: needs.trusted-default-branch.outputs.mode != 'sample'
    needs: [trusted-default-branch, normalize]
    uses: ./.github/workflows/catalog-quality.yml
    with:
      source_key: ${{ needs.trusted-default-branch.outputs.source_key }}
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      normalized_artifact_name: ${{ needs.normalize.outputs.normalized_artifact_name }}
      change_artifact_name: ${{ needs.normalize.outputs.change_artifact_name }}

  refresh:
    if: ${{ needs.trusted-default-branch.outputs.mode != 'sample' && (needs.trusted-default-branch.outputs.source_key == 'open-food-facts' || needs.trusted-default-branch.outputs.source_key == 'open-prices') }}
    needs: [trusted-default-branch, acquire, normalize, quality]
    uses: ./.github/workflows/catalog-refresh.yml
    with:
      source_key: ${{ needs.trusted-default-branch.outputs.source_key }}
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      source_artifact_name: ${{ needs.acquire.outputs.artifact_name }}
      normalized_artifact_name: ${{ needs.normalize.outputs.normalized_artifact_name }}
      change_artifact_name: ${{ needs.normalize.outputs.change_artifact_name }}
      quality_artifact_name: ${{ needs.quality.outputs.artifact_name }}

  retailer-policy:
    if: needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true'
    needs: trusted-default-branch
    uses: ./.github/workflows/source-policy.yml
    with:
      source_key: open-prices
      snapshot_id: ${{ needs.trusted-default-branch.outputs.retailer_snapshot_id }}
      mode: full

  retailer-acquire:
    if: needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true'
    needs: [trusted-default-branch, retailer-policy]
    uses: ./.github/workflows/acquire-catalog.yml
    with:
      source_key: open-prices
      snapshot_id: ${{ needs.trusted-default-branch.outputs.retailer_snapshot_id }}
      mode: full
      policy_artifact_name: ${{ needs.retailer-policy.outputs.artifact_name }}

  retailer-normalize:
    if: needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true'
    needs: [trusted-default-branch, retailer-acquire]
    uses: ./.github/workflows/normalize-and-diff.yml
    with:
      source_key: open-prices
      snapshot_id: ${{ needs.trusted-default-branch.outputs.retailer_snapshot_id }}
      source_artifact_name: ${{ needs.retailer-acquire.outputs.artifact_name }}

  retailer-quality:
    if: needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true'
    needs: [trusted-default-branch, retailer-normalize]
    uses: ./.github/workflows/catalog-quality.yml
    with:
      source_key: open-prices
      snapshot_id: ${{ needs.trusted-default-branch.outputs.retailer_snapshot_id }}
      normalized_artifact_name: ${{ needs.retailer-normalize.outputs.normalized_artifact_name }}
      change_artifact_name: ${{ needs.retailer-normalize.outputs.change_artifact_name }}

  retailer-refresh:
    if: needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true'
    needs: [trusted-default-branch, retailer-acquire, retailer-normalize, retailer-quality]
    uses: ./.github/workflows/catalog-refresh.yml
    with:
      source_key: open-prices
      snapshot_id: ${{ needs.trusted-default-branch.outputs.retailer_snapshot_id }}
      source_artifact_name: ${{ needs.retailer-acquire.outputs.artifact_name }}
      normalized_artifact_name: ${{ needs.retailer-normalize.outputs.normalized_artifact_name }}
      change_artifact_name: ${{ needs.retailer-normalize.outputs.change_artifact_name }}
      quality_artifact_name: ${{ needs.retailer-quality.outputs.artifact_name }}

  aggregate-normalize:
    if: needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true'
    needs: [trusted-default-branch, normalize, quality, refresh, retailer-normalize, retailer-quality, retailer-refresh]
    uses: ./.github/workflows/normalize-and-diff.yml
    with:
      source_key: open-food-facts
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      aggregate_retailer_evidence: true
      primary_normalized_artifact_name: ${{ needs.normalize.outputs.normalized_artifact_name }}
      retailer_normalized_artifact_name: ${{ needs.retailer-normalize.outputs.normalized_artifact_name }}
      primary_change_artifact_name: ${{ needs.normalize.outputs.change_artifact_name }}
      primary_basic_exclusions_artifact_name: ${{ needs.normalize.outputs.basic_exclusions_artifact_name }}
      retailer_snapshot_id: ${{ needs.trusted-default-branch.outputs.retailer_snapshot_id }}

  aggregate-quality:
    if: needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true'
    needs: [trusted-default-branch, quality, retailer-normalize, retailer-quality, aggregate-normalize]
    uses: ./.github/workflows/catalog-quality.yml
    with:
      source_key: open-food-facts
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      normalized_artifact_name: ${{ needs.aggregate-normalize.outputs.normalized_artifact_name }}
      change_artifact_name: ${{ needs.aggregate-normalize.outputs.change_artifact_name }}
      aggregate_retailer_evidence: true
      primary_quality_artifact_name: ${{ needs.quality.outputs.artifact_name }}
      retailer_quality_artifact_name: ${{ needs.retailer-quality.outputs.artifact_name }}
      retailer_normalized_artifact_name: ${{ needs.retailer-normalize.outputs.normalized_artifact_name }}
      retailer_snapshot_id: ${{ needs.trusted-default-branch.outputs.retailer_snapshot_id }}

  # Scheduled source refreshes stop after independent quality + refresh-state emission.
  # A trusted main manual full Open Food Facts proposal additionally pairs a same-run
  # Open Prices snapshot, quality-gates both, composes observational retailer evidence,
  # and only then enters build/proposal. Synthetic fixtures remain the no-secret proof.
  build:
    if: ${{ always() && needs.trusted-default-branch.outputs.proposal_enabled == 'true' && needs.trusted-default-branch.outputs.mode != 'sample' && (needs.trusted-default-branch.outputs.source_key == 'synthetic-fixture' || needs.refresh.result == 'success') && ((needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true' && needs.aggregate-normalize.result == 'success' && needs.aggregate-quality.result == 'success' && needs.retailer-refresh.result == 'success') || (needs.trusted-default-branch.outputs.production_aggregate_enabled != 'true' && needs.normalize.result == 'success' && needs.quality.result == 'success')) }}
    needs: [trusted-default-branch, normalize, quality, refresh, retailer-refresh, aggregate-normalize, aggregate-quality]
    uses: ./.github/workflows/build-catalog.yml
    with:
      source_key: ${{ needs.trusted-default-branch.outputs.source_key }}
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      catalog_version: ${{ needs.trusted-default-branch.outputs.catalog_version }}
      normalized_artifact_name: ${{ needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true' && needs.aggregate-normalize.outputs.normalized_artifact_name || needs.normalize.outputs.normalized_artifact_name }}
      quality_artifact_name: ${{ needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true' && needs.aggregate-quality.outputs.artifact_name || needs.quality.outputs.artifact_name }}
      basic_exclusions_artifact_name: ${{ needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true' && needs.aggregate-normalize.outputs.basic_exclusions_artifact_name || needs.normalize.outputs.basic_exclusions_artifact_name }}

  proposal-gate:
    if: ${{ always() && needs.build.result == 'success' }}
    needs: [trusted-default-branch, normalize, quality, refresh, retailer-refresh, aggregate-normalize, aggregate-quality, build]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/propose-catalog-update.yml
    with:
      source_key: ${{ needs.trusted-default-branch.outputs.source_key }}
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      database_artifact_name: ${{ needs.build.outputs.database_artifact_name }}
      manifest_artifact_name: ${{ needs.build.outputs.manifest_artifact_name }}
      normalized_artifact_name: ${{ needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true' && needs.aggregate-normalize.outputs.normalized_artifact_name || needs.normalize.outputs.normalized_artifact_name }}
      quality_artifact_name: ${{ needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true' && needs.aggregate-quality.outputs.artifact_name || needs.quality.outputs.artifact_name }}
      basic_exclusions_artifact_name: ${{ needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true' && needs.aggregate-normalize.outputs.basic_exclusions_artifact_name || needs.normalize.outputs.basic_exclusions_artifact_name }}

  promote-reviewed-refresh-states:
    if: ${{ always() && needs.trusted-default-branch.outputs.production_aggregate_enabled == 'true' && needs.refresh.result == 'success' && needs.retailer-refresh.result == 'success' && needs.aggregate-normalize.result == 'success' && needs.proposal-gate.result == 'success' }}
    needs: [trusted-default-branch, refresh, retailer-refresh, aggregate-normalize, proposal-gate]
    permissions:
      contents: write
    uses: ./.github/workflows/promote-refresh-state.yml
    with:
      source_key: open-food-facts
      snapshot_id: ${{ needs.trusted-default-branch.outputs.snapshot_id }}
      refresh_state_artifact_name: ${{ needs.refresh.outputs.state_artifact_name }}
      retailer_source_key: open-prices
      retailer_snapshot_id: ${{ needs.trusted-default-branch.outputs.retailer_snapshot_id }}
      retailer_refresh_state_artifact_name: ${{ needs.retailer-refresh.outputs.state_artifact_name }}
      normalized_artifact_name: ${{ needs.aggregate-normalize.outputs.normalized_artifact_name }}
      proposal_artifact_name: ${{ needs.proposal-gate.outputs.artifact_name }}
