name: Admitted submission refresh queue

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admitted-submission-refresh-queue
  cancel-in-progress: true

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require reviewed default-branch workflow code
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - name: Check out trusted workflow code without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build deterministic non-personal admitted-submission queue
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admitted-queue/payload"
          EVALUATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MAX_ENTRIES="$(python3 - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('Data/refresh/catalog-refresh-policy-v1.json').read_text(encoding='utf-8'))
          print(policy['queue']['maxEntries'])
          PY
          )"
          python3 Tools/catalog_refresh_submission_targets.py derive \
            --admitted-directory Data/submissions/admitted \
            --output "$RUNNER_TEMP/admitted-queue/targets.json"
          EVALUATED_AT="$EVALUATED_AT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          value = {
              'schemaVersion': 1,
              'market': 'DE',
              'evaluatedAt': os.environ['EVALUATED_AT'],
              'entries': [],
              'targetedExecution': {
                  'sourceKey': 'open-food-facts',
                  'enabled': True,
                  'endpointReference': 'https://world.openfoodfacts.org/api/v2/search',
                  'gtinCount': 0,
                  'batchSize': 40,
                  'batches': [],
                  'maxRequestsPerMinute': 10,
                  'minimumRequestIntervalSeconds': 7,
                  'minimumExecutionSeconds': 0,
                  'fields': [],
                  'networkExecutionPerformed': False,
              },
          }
          base = {key: item for key, item in value.items() if key != 'queueSha256'}
          value['queueSha256'] = hashlib.sha256(
              json.dumps(base, sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()
          Path(os.environ['RUNNER_TEMP'] + '/admitted-queue/base.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          python3 Tools/catalog_refresh_submission_targets.py merge \
            --queue "$RUNNER_TEMP/admitted-queue/base.json" \
            --targets "$RUNNER_TEMP/admitted-queue/targets.json" \
            --max-entries "$MAX_ENTRIES" \
            --output "$RUNNER_TEMP/admitted-queue/payload/refresh-queue.json"
          python3 Tools/catalog_refresh_plan.py plan \
            --policy Data/refresh/catalog-refresh-policy-v1.json \
            --source-policy Data/sources/open-food-facts/source-policy-v1.json \
            --source-key open-food-facts \
            --lane targeted \
            --evaluated-at "$EVALUATED_AT" \
            --previous-state Data/refresh/accepted-open-food-facts-v1.json \
            --refresh-queue "$RUNNER_TEMP/admitted-queue/payload/refresh-queue.json" \
            --output "$RUNNER_TEMP/admitted-queue/payload/refresh-plan.json"
          python3 Tools/catalog_refresh_plan.py validate \
            --input "$RUNNER_TEMP/admitted-queue/payload/refresh-plan.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'admitted-queue/payload'
          queue = json.loads((root / 'refresh-queue.json').read_text(encoding='utf-8'))
          plan = json.loads((root / 'refresh-plan.json').read_text(encoding='utf-8'))
          if plan['targetedExecution']['networkExecutionPerformed'] is not False:
              raise SystemExit('admitted submission queue unexpectedly performed network execution')
          if plan['targetedExecution']['networkExecutionAllowed'] is not False:
              raise SystemExit('current OFF source policy must not authorize targeted API execution')
          if any(item.get('reason') != 'admitted-submission' for item in queue['entries']):
              raise SystemExit('admitted submission queue contains unexpected reason')
          text = json.dumps({'queue': queue, 'plan': plan})
          for forbidden in ('email', 'userId', 'reviewerID', 'scanHistory', 'rawPackage'):
              if forbidden.lower() in text.lower():
                  raise SystemExit(f'privacy-sensitive token leaked into queue: {forbidden}')
          PY

      - name: Upload privacy-safe admitted-submission queue
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admitted-submission-refresh-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/admitted-queue/payload
          if-no-files-found: error
          retention-days: 90
