name: Catalog source policy

on:
  workflow_call:
    inputs:
      source_key:
        description: Registered source key.
        required: true
        type: string
      snapshot_id:
        description: Immutable source snapshot identifier.
        required: true
        type: string
      mode:
        description: Registered acquisition mode.
        required: true
        type: string
    outputs:
      artifact_name:
        description: Uploaded policy-report artifact name.
        value: ${{ jobs.policy.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      source_key:
        description: Registered source key.
        required: true
        default: synthetic-fixture
        type: string
      snapshot_id:
        description: Immutable source snapshot identifier.
        required: true
        default: fixture-manual
        type: string
      mode:
        description: Registered acquisition mode.
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - sample
          - full

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_name: ${{ steps.name.outputs.artifact_name }}
    steps:
      - name: Check out trusted workflow code without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate registered source and bounded inputs
        env:
          SOURCE_KEY: ${{ inputs.source_key }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          ACQUISITION_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/policy/payload"
          python3 Tools/catalog_workflow.py validate-source \
            --source-key "$SOURCE_KEY" \
            --snapshot-id "$SNAPSHOT_ID" \
            --mode "$ACQUISITION_MODE" \
            > "$RUNNER_TEMP/policy/payload/policy-report.json"
          python3 Tools/catalog_workflow.py emit-handoff \
            --artifact-kind policy-report \
            --source-key "$SOURCE_KEY" \
            --snapshot-id "$SNAPSHOT_ID" \
            --producer-commit "$GITHUB_SHA" \
            --producer-workflow source-policy.yml \
            --run-id "$GITHUB_RUN_ID" \
            --payload "$RUNNER_TEMP/policy/payload/policy-report.json" \
            --payload-relative-path payload/policy-report.json \
            --record-count 1 \
            --completeness complete \
            --redistribution-class metadata-only \
            --content-schema-version workflow-policy-report-v1 \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/policy/handoff.json"

      - name: Define immutable artifact name
        id: name
        env:
          SOURCE_KEY: ${{ inputs.source_key }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: echo "artifact_name=policy-${SOURCE_KEY}-${SNAPSHOT_ID}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload bounded metadata-only policy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ runner.temp }}/policy
          if-no-files-found: error
          retention-days: 14
