name: Bootstrap Completion Guardian

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-completion-guardian.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: halal-food-eu-bootstrap-completion-guardian
  cancel-in-progress: false

env:
  PULL_REQUEST_NUMBER: "2"
  FINALIZER_WORKFLOW: finalize-bootstrap.yml

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch once or clean completed bootstrap machinery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          merged="$(jq -r '.merged' <<<"${pr_json}")"

          delete_from_main() {
            local path="$1"
            local sha
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [[ -z "${sha}" ]]; then
              return 0
            fi
            local payload
            payload="$(jq -n \
              --arg message "ci: remove completed bootstrap-only machinery" \
              --arg sha "${sha}" \
              '{message: $message, sha: $sha, branch: "main"}')"
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --input - <<<"${payload}" >/dev/null
          }

          if [[ "${merged}" == "true" ]]; then
            delete_from_main ".github/bootstrap-finalizer-trigger"
            delete_from_main ".github/workflows/bootstrap-validation.yml"
            delete_from_main ".github/workflows/finalize-bootstrap-trigger.yml"
            delete_from_main ".github/workflows/finalize-bootstrap-dispatch.yml"
            delete_from_main ".github/workflows/cleanup-bootstrap-triggers.yml"
            delete_from_main ".github/workflows/finalize-bootstrap.yml"
            delete_from_main ".github/workflows/bootstrap-completion-guardian.yml"
            exit 0
          fi

          if [[ "${state}" != "open" ]]; then
            echo "Pull request is closed without merge; refusing automation." >&2
            exit 1
          fi

          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${FINALIZER_WORKFLOW}/runs?per_page=10")"
          latest_status="$(jq -r '.workflow_runs[0].status // "none"' <<<"${runs_json}")"
          latest_conclusion="$(jq -r '.workflow_runs[0].conclusion // "none"' <<<"${runs_json}")"

          case "${latest_status}:${latest_conclusion}" in
            queued:*|in_progress:*|waiting:*|pending:*|requested:*)
              echo "Finalizer is already active; no duplicate dispatch."
              exit 0
              ;;
            completed:failure|completed:cancelled|completed:timed_out|completed:action_required|completed:stale|completed:startup_failure)
              echo "Latest finalizer is terminal and not successful; refusing blind retry." >&2
              exit 1
              ;;
            completed:success)
              echo "Finalizer succeeded but merge is not yet visible; next invocation will reconcile."
              exit 0
              ;;
            none:none)
              ;;
            *)
              echo "Unrecognized finalizer state ${latest_status}:${latest_conclusion}; refusing dispatch." >&2
              exit 1
              ;;
          esac

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${FINALIZER_WORKFLOW}/dispatches" \
            -f ref=main >/dev/null
