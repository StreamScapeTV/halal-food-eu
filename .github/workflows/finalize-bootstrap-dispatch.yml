name: Dispatch Exact Bootstrap Finalizer
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-bootstrap-dispatch.yml
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalizer workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/finalize-bootstrap.yml/dispatches" -f ref=main
