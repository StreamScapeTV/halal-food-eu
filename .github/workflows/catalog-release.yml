name: Catalog release evidence

on:
  push:
    branches: [main]
    paths:
      - "HalalFoodEU/Resources/catalog.sqlite3"
      - "HalalFoodEU/Resources/catalog-manifest.json"
      - "Tools/catalog_workflow.py"
      - "Tools/catalog_security.py"
      - "Data/workflows/**"
      - "Data/security/**"
      - ".github/workflows/catalog-release.yml"
  workflow_dispatch:
    inputs:
      attest:
        description: Create GitHub provenance attestations for the integrated catalog artifacts.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: catalog-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require integrated main ref
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - name: Check out integrated main without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Materialize deterministic bundled catalog from integrated reviewed input
        run: |
          set -euo pipefail
          python3 Tools/catalog_builder.py \
            --input Data/sample-products.json \
            --database HalalFoodEU/Resources/catalog.sqlite3 \
            --manifest HalalFoodEU/Resources/catalog-manifest.json
          python3 Tools/catalog_security.py bind-manifest \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json

      - name: Validate bundled catalog before release evidence
        run: |
          set -euo pipefail
          python3 Tools/validate_catalog.py \
            --database HalalFoodEU/Resources/catalog.sqlite3 \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source Data/sample-products.json
          python3 Tools/catalog_security.py validate-manifest \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json
          python3 Tools/catalog_workflow.py validate-contract

      - name: Emit post-merge checksum report
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release/payload"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          database = Path('HalalFoodEU/Resources/catalog.sqlite3')
          manifest = Path('HalalFoodEU/Resources/catalog-manifest.json')
          report = {
              'schemaVersion': 1,
              'commitSha': os.environ['GITHUB_SHA'],
              'databaseSha256': hashlib.sha256(database.read_bytes()).hexdigest(),
              'manifestSha256': hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'sourcePolicy': json.loads(manifest.read_text(encoding='utf-8'))['sourcePolicy'],
              'appStoreSigningPerformed': False,
              'remoteCatalogPublicationPerformed': False,
          }
          Path(os.environ['RUNNER_TEMP'] + '/release/payload/release-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          python3 Tools/catalog_workflow.py emit-handoff \
            --artifact-kind release-report \
            --source-key aggregate \
            --snapshot-id "main-${GITHUB_SHA:0:12}" \
            --producer-commit "$GITHUB_SHA" \
            --producer-workflow catalog-release.yml \
            --run-id "$GITHUB_RUN_ID" \
            --payload "$RUNNER_TEMP/release/payload/release-report.json" \
            --payload-relative-path payload/release-report.json \
            --record-count 1 \
            --completeness complete \
            --redistribution-class metadata-only \
            --content-schema-version release-report-v1 \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/release/handoff.json"

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

  attestation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.attest && github.ref == 'refs/heads/main' }}
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact integrated main without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Materialize exact attestation subjects from integrated reviewed input
        run: |
          set -euo pipefail
          python3 Tools/catalog_builder.py \
            --input Data/sample-products.json \
            --database HalalFoodEU/Resources/catalog.sqlite3 \
            --manifest HalalFoodEU/Resources/catalog-manifest.json
          python3 Tools/catalog_security.py bind-manifest \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json

      - name: Revalidate attestation subjects
        run: |
          set -euo pipefail
          python3 Tools/validate_catalog.py \
            --database HalalFoodEU/Resources/catalog.sqlite3 \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source Data/sample-products.json
          python3 Tools/catalog_security.py validate-manifest \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source-policy Data/workflows/catalog-workflow-contract-v1.json

      - name: Attest integrated catalog provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            HalalFoodEU/Resources/catalog.sqlite3
            HalalFoodEU/Resources/catalog-manifest.json
