name: Catalog health

on:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-health
  cancel-in-progress: true

jobs:
  catalog-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require reviewed default-branch workflow code
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - name: Check out trusted default-branch code without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate health contracts and tests
        run: |
          set -euo pipefail
          python3 Tools/catalog_workflow.py validate-contract
          python3 Tools/catalog_workflow.py validate-workflows --root .github/workflows
          python3 Tools/catalog_quality.py validate-policy \
            --policy Data/quality/catalog-quality-policy-v1.json \
            --source-reviews Data/quality/source-review-policy-v1.json
          python3 Tools/tests/test_catalog_health.py

      - name: Build exact-revision scheduled health report
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/health/payload"
          EVALUATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$RUNNER_TEMP/health/change-report.json" <<'JSON'
          {
            "schemaVersion": 1,
            "sourceKey": "synthetic-fixture",
            "snapshotID": "committed-runtime-fixture",
            "baseline": "none",
            "additions": 0,
            "unchanged": 0,
            "formulationChanges": 0,
            "removals": 0,
            "reviewQueue": [],
            "noCompletenessClaim": true
          }
          JSON
          python3 Tools/catalog_quality.py evaluate \
            --policy Data/quality/catalog-quality-policy-v1.json \
            --source-reviews Data/quality/source-review-policy-v1.json \
            --workflow-contract Data/workflows/catalog-workflow-contract-v1.json \
            --evidence Data/evidence/sample-evidence-v1.json \
            --change-report "$RUNNER_TEMP/health/change-report.json" \
            --source-key synthetic-fixture \
            --snapshot-id committed-runtime-fixture \
            --as-of "$EVALUATED_AT" \
            --output "$RUNNER_TEMP/health/quality-report.json" \
            --summary-output "$RUNNER_TEMP/health/quality-summary.md" \
            --defer-blocker-exit
          python3 Tools/catalog_health.py build \
            --evidence Data/evidence/sample-evidence-v1.json \
            --quality-report "$RUNNER_TEMP/health/quality-report.json" \
            --change-report "$RUNNER_TEMP/health/change-report.json" \
            --evaluated-at "$EVALUATED_AT" \
            --commit-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/health/payload/catalog-health.json" \
            --markdown-output "$RUNNER_TEMP/health/catalog-health.md"
          python3 Tools/catalog_health.py validate \
            --input "$RUNNER_TEMP/health/payload/catalog-health.json"
          cat "$RUNNER_TEMP/health/catalog-health.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Emit immutable health handoff
        run: |
          set -euo pipefail
          python3 Tools/catalog_workflow.py emit-handoff \
            --artifact-kind health-report \
            --source-key aggregate \
            --snapshot-id "health-${GITHUB_RUN_ID}" \
            --producer-commit "$GITHUB_SHA" \
            --producer-workflow catalog-health.yml \
            --run-id "$GITHUB_RUN_ID" \
            --payload "$RUNNER_TEMP/health/payload/catalog-health.json" \
            --payload-relative-path payload/catalog-health.json \
            --record-count 1 \
            --completeness complete \
            --redistribution-class metadata-only \
            --content-schema-version catalog-health-v1 \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/health/handoff.json"

      - name: Upload health report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-health-${{ github.run_id }}
          path: ${{ runner.temp }}/health
          if-no-files-found: error
          retention-days: 90
