name: Trigger Reviewed Bootstrap Finalizer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-bootstrap-trigger.yml
permissions:
  actions: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run finalize-bootstrap.yml --ref main
