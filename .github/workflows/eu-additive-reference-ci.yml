name: EU additive reference CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eu-additive-reference-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Validate EU additive identity reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate source registration and reference data
        run: |
          set -euo pipefail
          python3 -m json.tool Data/methodology/additive-identities-v1.json >/dev/null
          python3 -m json.tool Data/methodology/additive-identities-v1.schema.json >/dev/null
          python3 -m json.tool Data/sources/eu-additives/source-policy-v1.json >/dev/null
          python3 -m json.tool Data/quality/source-review-policy-v1.json >/dev/null
          python3 -m json.tool Data/workflows/catalog-workflow-contract-v1.json >/dev/null
          python3 -m py_compile Tools/halal_methodology_reference.py Tools/tests/test_halal_methodology_reference.py
          python3 Tools/catalog_workflow.py validate-contract >/dev/null
          python3 Tools/catalog_workflow.py validate-source \
            --source-key eu-additives \
            --snapshot-id eu-additives-2026-08-18 \
            --mode full >/dev/null
          python3 Tools/halal_methodology_reference.py validate

      - name: Run additive reference tests
        run: |
          set -euo pipefail
          PYTHONPATH=Tools python3 -m unittest Tools.tests.test_halal_methodology_reference -v

      - name: Build and inspect compact SQLite reference
        run: |
          set -euo pipefail
          python3 Tools/halal_methodology_reference.py sqlite \
            --output "$RUNNER_TEMP/eu-additives.sqlite3"
          python3 - "$RUNNER_TEMP/eu-additives.sqlite3" <<'PY'
          import sqlite3
          import sys

          connection = sqlite3.connect(sys.argv[1])
          try:
              assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert connection.execute("SELECT COUNT(*) FROM additives").fetchone()[0] >= 9
              plan = " ".join(
                  row[3].upper()
                  for row in connection.execute(
                      "EXPLAIN QUERY PLAN SELECT additive_id FROM additive_names WHERE language=? AND normalized_name=?",
                      ("de", "lecithine"),
                  )
              )
              assert "INDEX" in plan, plan
          finally:
              connection.close()
          PY
