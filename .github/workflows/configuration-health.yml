name: Configuration health

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: configuration-health
  cancel-in-progress: true

jobs:
  configuration-health:
    name: Public identity and optional credential health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require reviewed default-branch workflow code
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"

      - name: Check out trusted default-branch code without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate public project configuration
        run: |
          set -euo pipefail
          PYTHONPATH=Tools python3 Tools/project_configuration.py validate

      - name: Evaluate optional credential-name state without secret values
        id: health
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/configuration-health"
          set +e
          PYTHONPATH=Tools python3 Tools/project_configuration.py health \
            --output "$RUNNER_TEMP/configuration-health/report.json"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 2 ]]; then
            echo "status=blocked" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Reconcile deduplicated owner-input issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=Tools python3 Tools/github_configuration_health.py \
            --report "$RUNNER_TEMP/configuration-health/report.json" \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload metadata-only configuration health report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configuration-health-${{ github.run_id }}
          path: ${{ runner.temp }}/configuration-health/report.json
          if-no-files-found: error
          retention-days: 14
