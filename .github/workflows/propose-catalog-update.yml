name: Catalog proposal gate

on:
  workflow_call:
    inputs:
      snapshot_id:
        required: true
        type: string
      database_artifact_name:
        required: true
        type: string
      manifest_artifact_name:
        required: true
        type: string
      quality_artifact_name:
        required: true
        type: string
    outputs:
      proposal_key:
        value: ${{ jobs.proposal.outputs.proposal_key }}
      artifact_name:
        value: ${{ jobs.proposal.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proposal_key: ${{ steps.plan.outputs.proposal_key }}
      artifact_name: ${{ steps.name.outputs.artifact_name }}
    steps:
      - name: Check out trusted workflow code without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download catalog database
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.database_artifact_name }}
          path: ${{ runner.temp }}/database

      - name: Download catalog manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.manifest_artifact_name }}
          path: ${{ runner.temp }}/manifest

      - name: Download quality report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.quality_artifact_name }}
          path: ${{ runner.temp }}/quality

      - name: Validate proposal inputs
        run: |
          set -euo pipefail
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/database/handoff.json" \
            --consumer-stage proposal \
            --payload-root "$RUNNER_TEMP/database"
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/manifest/handoff.json" \
            --consumer-stage proposal \
            --payload-root "$RUNNER_TEMP/manifest"
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/quality/handoff.json" \
            --consumer-stage proposal \
            --payload-root "$RUNNER_TEMP/quality"

      - name: Derive deterministic generated-update identity and review report
        id: plan
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proposal/payload"
          CATALOG_DIGEST="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw = json.loads(Path(os.environ['RUNNER_TEMP'] + '/database/handoff.json').read_text())
          print(raw['payload']['sha256'])
          PY
          )"
          PROPOSAL_KEY="$(python3 Tools/catalog_workflow.py proposal-key \
            --source-key aggregate \
            --snapshot-id "$SNAPSHOT_ID" \
            --catalog-digest "$CATALOG_DIGEST")"
          echo "proposal_key=$PROPOSAL_KEY" >> "$GITHUB_OUTPUT"
          PROPOSAL_KEY="$PROPOSAL_KEY" CATALOG_DIGEST="$CATALOG_DIGEST" python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = {
              'schemaVersion': 1,
              'proposalKey': os.environ['PROPOSAL_KEY'],
              'snapshotId': os.environ['SNAPSHOT_ID'],
              'catalogSha256': os.environ['CATALOG_DIGEST'],
              'materialChangeAutoMergeAllowed': False,
              'requiresHumanReview': True,
              'fixtureOnly': True,
              'note': 'Issue #12 owns production catalog file synchronization into the generated branch; this gate fixes the idempotent proposal identity and validates the exact inputs first.',
          }
          Path(os.environ['RUNNER_TEMP'] + '/proposal/payload/proposal-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          python3 Tools/catalog_workflow.py emit-handoff \
            --artifact-kind proposal-report \
            --source-key aggregate \
            --snapshot-id "$SNAPSHOT_ID" \
            --producer-commit "$GITHUB_SHA" \
            --producer-workflow propose-catalog-update.yml \
            --run-id "$GITHUB_RUN_ID" \
            --payload "$RUNNER_TEMP/proposal/payload/proposal-report.json" \
            --payload-relative-path payload/proposal-report.json \
            --record-count 1 \
            --completeness complete \
            --redistribution-class metadata-only \
            --content-schema-version proposal-report-v1 \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/proposal/handoff.json"

      - name: Define proposal report artifact name
        id: name
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: echo "artifact_name=proposal-${SNAPSHOT_ID}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload proposal review report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ runner.temp }}/proposal
          if-no-files-found: error
          retention-days: 14
