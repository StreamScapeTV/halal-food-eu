name: Bootstrap PR Validation

on:
  schedule:
    - cron: "5 16 26 8 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog integrity (bootstrap)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out finalized bootstrap branch
        uses: actions/checkout@v6
        with:
          ref: agent/1-bootstrap-ios-foundation

      - name: Build and validate synthetic catalog
        run: |
          python3 Tools/catalog_builder.py \
            --input Data/sample-products.json \
            --database HalalFoodEU/Resources/catalog.sqlite3 \
            --manifest HalalFoodEU/Resources/catalog-manifest.json
          python3 Tools/validate_catalog.py \
            --database HalalFoodEU/Resources/catalog.sqlite3 \
            --manifest HalalFoodEU/Resources/catalog-manifest.json \
            --source Data/sample-products.json

  ios:
    name: iOS 18+ build and tests (bootstrap)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out finalized bootstrap branch
        uses: actions/checkout@v6
        with:
          ref: agent/1-bootstrap-ios-foundation

      - name: Install deterministic project generator
        run: brew install xcodegen

      - name: Generate, build, and test
        run: ./Scripts/ci-ios.sh
