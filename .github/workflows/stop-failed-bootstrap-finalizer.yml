name: Stop Failed Bootstrap Finalizer

on:
  workflow_run:
    workflows:
      - Finalize Reviewed Bootstrap
    types:
      - completed

permissions:
  contents: write

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove bootstrap machinery after a terminal result
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          delete_from_main() {
            local path="$1"
            local sha
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [[ -z "${sha}" ]]; then
              return 0
            fi
            local payload
            payload="$(jq -n \
              --arg message "ci: remove terminal bootstrap-only machinery" \
              --arg sha "${sha}" \
              '{message: $message, sha: $sha, branch: "main"}')"
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --input - <<<"${payload}" >/dev/null
          }

          if [[ "${FINALIZER_CONCLUSION}" != "success" ]]; then
            delete_from_main ".github/bootstrap-finalizer-trigger"
            delete_from_main ".github/workflows/bootstrap-validation.yml"
            delete_from_main ".github/workflows/finalize-bootstrap-trigger.yml"
            delete_from_main ".github/workflows/finalize-bootstrap-dispatch.yml"
            delete_from_main ".github/workflows/cleanup-bootstrap-triggers.yml"
            delete_from_main ".github/workflows/bootstrap-completion-guardian.yml"
            delete_from_main ".github/workflows/finalize-bootstrap.yml"
          fi

          delete_from_main ".github/workflows/stop-failed-bootstrap-finalizer.yml"
