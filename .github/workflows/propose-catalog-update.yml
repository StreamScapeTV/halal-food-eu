name: Catalog proposal gate

on:
  workflow_call:
    inputs:
      source_key:
        required: true
        type: string
      snapshot_id:
        required: true
        type: string
      database_artifact_name:
        required: true
        type: string
      manifest_artifact_name:
        required: true
        type: string
      normalized_artifact_name:
        required: true
        type: string
      quality_artifact_name:
        required: true
        type: string
      basic_exclusions_artifact_name:
        required: true
        type: string
    outputs:
      proposal_key:
        value: ${{ jobs.proposal.outputs.proposal_key }}
      artifact_name:
        value: ${{ jobs.proposal.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proposal_key: ${{ steps.plan.outputs.proposal_key }}
      artifact_name: ${{ steps.name.outputs.artifact_name }}
    steps:
      - name: Check out trusted workflow code without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download catalog database
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.database_artifact_name }}
          path: ${{ runner.temp }}/database

      - name: Download catalog manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.manifest_artifact_name }}
          path: ${{ runner.temp }}/manifest

      - name: Download normalized evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.normalized_artifact_name }}
          path: ${{ runner.temp }}/normalized

      - name: Download quality report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.quality_artifact_name }}
          path: ${{ runner.temp }}/quality

      - name: Download digest-bound basic exclusions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.basic_exclusions_artifact_name }}
          path: ${{ runner.temp }}/basic-exclusions

      - name: Validate proposal inputs
        run: |
          set -euo pipefail
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/database/handoff.json" \
            --consumer-stage proposal \
            --payload-root "$RUNNER_TEMP/database"
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/manifest/handoff.json" \
            --consumer-stage proposal \
            --payload-root "$RUNNER_TEMP/manifest"
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/quality/handoff.json" \
            --consumer-stage proposal \
            --payload-root "$RUNNER_TEMP/quality"
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/normalized/handoff.json" \
            --consumer-stage build \
            --payload-root "$RUNNER_TEMP/normalized"
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/basic-exclusions/handoff.json" \
            --consumer-stage build \
            --payload-root "$RUNNER_TEMP/basic-exclusions"

      - name: Derive deterministic generated-update identity and review report
        id: plan
        env:
          SOURCE_KEY: ${{ inputs.source_key }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          NORMALIZED_ARTIFACT_NAME: ${{ inputs.normalized_artifact_name }}
          QUALITY_ARTIFACT_NAME: ${{ inputs.quality_artifact_name }}
          BASIC_EXCLUSIONS_ARTIFACT_NAME: ${{ inputs.basic_exclusions_artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proposal/payload"
          if [[ "$SOURCE_KEY" == "synthetic-fixture" ]]; then
            CATALOG_DIGEST="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw = json.loads(Path(os.environ['RUNNER_TEMP'] + '/database/handoff.json').read_text())
          print(raw['payload']['sha256'])
          PY
            )"
            PROPOSAL_KEY="$(python3 Tools/catalog_workflow.py proposal-key \
              --source-key "$SOURCE_KEY" \
              --snapshot-id "$SNAPSHOT_ID" \
              --catalog-digest "$CATALOG_DIGEST")"
            SOURCE_KEY="$SOURCE_KEY" PROPOSAL_KEY="$PROPOSAL_KEY" CATALOG_DIGEST="$CATALOG_DIGEST" python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = {
              'schemaVersion': 1,
              'proposalKey': os.environ['PROPOSAL_KEY'],
              'sourceKey': os.environ['SOURCE_KEY'],
              'snapshotId': os.environ['SNAPSHOT_ID'],
              'catalogSha256': os.environ['CATALOG_DIGEST'],
              'materialChangeAutoMergeAllowed': False,
              'requiresHumanReview': True,
              'fixtureOnly': True,
              'note': 'Synthetic workflow fixture: no repository mutation is performed by this proof path.',
          }
          Path(os.environ['RUNNER_TEMP'] + '/proposal/payload/proposal-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          elif [[ "$SOURCE_KEY" == "open-food-facts" ]]; then
            python3 Tools/production_catalog_proposal.py \
              --source-key "$SOURCE_KEY" \
              --snapshot-id "$SNAPSHOT_ID" \
              --database-handoff "$RUNNER_TEMP/database/handoff.json" \
              --database-root "$RUNNER_TEMP/database" \
              --manifest-handoff "$RUNNER_TEMP/manifest/handoff.json" \
              --manifest-root "$RUNNER_TEMP/manifest" \
              --quality-handoff "$RUNNER_TEMP/quality/handoff.json" \
              --quality-root "$RUNNER_TEMP/quality" \
              --output "$RUNNER_TEMP/proposal/payload/proposal-report.json"
            python3 Tools/production_catalog_release_input.py create \
              --source-key "$SOURCE_KEY" \
              --snapshot-id "$SNAPSHOT_ID" \
              --proposal-report "$RUNNER_TEMP/proposal/payload/proposal-report.json" \
              --normalized-handoff "$RUNNER_TEMP/normalized/handoff.json" \
              --normalized-root "$RUNNER_TEMP/normalized" \
              --normalized-artifact-name "$NORMALIZED_ARTIFACT_NAME" \
              --quality-handoff "$RUNNER_TEMP/quality/handoff.json" \
              --quality-root "$RUNNER_TEMP/quality" \
              --quality-artifact-name "$QUALITY_ARTIFACT_NAME" \
              --basic-exclusions-handoff "$RUNNER_TEMP/basic-exclusions/handoff.json" \
              --basic-exclusions-root "$RUNNER_TEMP/basic-exclusions" \
              --basic-exclusions-artifact-name "$BASIC_EXCLUSIONS_ARTIFACT_NAME" \
              --output "$RUNNER_TEMP/proposal/payload/production-catalog-release-input.json"
            PROPOSAL_KEY="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['RUNNER_TEMP'] + '/proposal/payload/proposal-report.json').read_text())
          print(report['proposalKey'])
          PY
            )"
          else
            echo "No production proposal gate is admitted for source $SOURCE_KEY" >&2
            exit 2
          fi
          echo "proposal_key=$PROPOSAL_KEY" >> "$GITHUB_OUTPUT"
          python3 Tools/catalog_workflow.py emit-handoff \
            --artifact-kind proposal-report \
            --source-key "$SOURCE_KEY" \
            --snapshot-id "$SNAPSHOT_ID" \
            --producer-commit "$GITHUB_SHA" \
            --producer-workflow propose-catalog-update.yml \
            --run-id "$GITHUB_RUN_ID" \
            --payload "$RUNNER_TEMP/proposal/payload/proposal-report.json" \
            --payload-relative-path payload/proposal-report.json \
            --record-count 1 \
            --completeness complete \
            --redistribution-class metadata-only \
            --content-schema-version proposal-report-v1 \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/proposal/handoff.json"

      - name: Define proposal report artifact name
        id: name
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: echo "artifact_name=proposal-${SNAPSHOT_ID}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload proposal review report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ runner.temp }}/proposal
          if-no-files-found: error
          retention-days: 14

  ios-validation:
    if: inputs.source_key == 'open-food-facts'
    needs: proposal
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_COMMIT: 8445e778451c7e44237b90281bde622d764b0084
    steps:
      - name: Check out exact reviewed source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download exact proposed catalog database
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.database_artifact_name }}
          path: ${{ runner.temp }}/database

      - name: Download exact proposed catalog manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.manifest_artifact_name }}
          path: ${{ runner.temp }}/manifest

      - name: Validate exact iOS catalog handoffs and lineage
        env:
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: |
          set -euo pipefail
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/database/handoff.json" \
            --consumer-stage ios-validation \
            --payload-root "$RUNNER_TEMP/database"
          python3 Tools/catalog_workflow.py validate-handoff \
            --input "$RUNNER_TEMP/manifest/handoff.json" \
            --consumer-stage ios-validation \
            --payload-root "$RUNNER_TEMP/manifest"
          python3 Tools/production_catalog.py validate \
            --database "$RUNNER_TEMP/database/payload/catalog.sqlite3" \
            --manifest "$RUNNER_TEMP/manifest/payload/catalog-manifest.json"
          SNAPSHOT_ID="$SNAPSHOT_ID" python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          database = json.loads((root / 'database/handoff.json').read_text(encoding='utf-8'))
          manifest_handoff = json.loads((root / 'manifest/handoff.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest/payload/catalog-manifest.json').read_text(encoding='utf-8'))
          for label, handoff in (('database', database), ('manifest', manifest_handoff)):
              if handoff.get('sourceKey') != 'aggregate':
                  raise SystemExit(f'{label} iOS handoff must use aggregate source identity')
              if handoff.get('snapshotId') != os.environ['SNAPSHOT_ID']:
                  raise SystemExit(f'{label} iOS handoff snapshot differs from caller')
          if database.get('producer') != manifest_handoff.get('producer'):
              raise SystemExit('iOS database and manifest must come from the same immutable build')
          if database['producer'].get('workflow') != 'build-catalog.yml':
              raise SystemExit('iOS catalog producer must be build-catalog.yml')
          if manifest.get('sha256') != database.get('payload', {}).get('sha256'):
              raise SystemExit('iOS manifest does not bind the exact database handoff digest')
          if manifest.get('sourceCommit') != os.environ['GITHUB_SHA']:
              raise SystemExit('iOS catalog sourceCommit differs from exact reviewed workflow code')
          PY

      - name: Build reviewed XcodeGen source pin
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/XcodeGen" "$RUNNER_TEMP/bin"
          git -C "$RUNNER_TEMP/XcodeGen" init
          git -C "$RUNNER_TEMP/XcodeGen" remote add origin https://github.com/yonaskolb/XcodeGen.git
          git -C "$RUNNER_TEMP/XcodeGen" fetch --depth=1 origin "$XCODEGEN_COMMIT"
          test "$(git -C "$RUNNER_TEMP/XcodeGen" rev-parse FETCH_HEAD)" = "$XCODEGEN_COMMIT"
          git -C "$RUNNER_TEMP/XcodeGen" checkout --detach FETCH_HEAD
          test -f "$RUNNER_TEMP/XcodeGen/Package.resolved"
          (
            cd "$RUNNER_TEMP/XcodeGen"
            swift build -c release --disable-sandbox
          )
          cp "$RUNNER_TEMP/XcodeGen/.build/release/xcodegen" "$RUNNER_TEMP/bin/xcodegen"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build and test iOS against the exact proposed digest
        env:
          HFEU_PREBUILT_CATALOG_DATABASE: ${{ runner.temp }}/database/payload/catalog.sqlite3
          HFEU_PREBUILT_CATALOG_MANIFEST: ${{ runner.temp }}/manifest/payload/catalog-manifest.json
        run: ./Scripts/ci-ios.sh

      - name: Emit exact iOS validation report
        env:
          SOURCE_KEY: ${{ inputs.source_key }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-validation/payload"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          database = json.loads((root / 'database/handoff.json').read_text(encoding='utf-8'))
          manifest_handoff = json.loads((root / 'manifest/handoff.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest/payload/catalog-manifest.json').read_text(encoding='utf-8'))
          report = {
              'schemaVersion': 1,
              'sourceKey': os.environ['SOURCE_KEY'],
              'snapshotId': os.environ['SNAPSHOT_ID'],
              'catalogVersion': manifest['catalogVersion'],
              'databaseSha256': database['payload']['sha256'],
              'manifestSha256': manifest_handoff['payload']['sha256'],
              'catalogProducerCommit': database['producer']['commitSha'],
              'catalogProducerRunId': database['producer']['runId'],
              'validationCommit': os.environ['GITHUB_SHA'],
              'validationRunId': os.environ['GITHUB_RUN_ID'],
              'status': 'pass',
              'testSurface': 'ProductionCatalogArtifactCompatibilityTests',
          }
          (root / 'ios-validation/payload/ios-validation-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          python3 Tools/catalog_workflow.py emit-handoff \
            --artifact-kind ios-validation-report \
            --source-key "$SOURCE_KEY" \
            --snapshot-id "$SNAPSHOT_ID" \
            --producer-commit "$GITHUB_SHA" \
            --producer-workflow propose-catalog-update.yml \
            --run-id "$GITHUB_RUN_ID" \
            --payload "$RUNNER_TEMP/ios-validation/payload/ios-validation-report.json" \
            --payload-relative-path payload/ios-validation-report.json \
            --record-count 1 \
            --completeness complete \
            --redistribution-class metadata-only \
            --content-schema-version ios-validation-report-v1 \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/ios-validation/handoff.json"

      - name: Upload exact iOS validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-validation-${{ inputs.snapshot_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-validation
          if-no-files-found: error
          retention-days: 14

  materialize-production-proposal:
    if: inputs.source_key == 'open-food-facts'
    needs: [proposal, ios-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require reviewed default-branch trusted caller
        env:
          EXPECTED_REF: refs/heads/main
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$EVENT_NAME" = "workflow_dispatch" -o "$EVENT_NAME" = "schedule"

      - name: Check out exact reviewed default branch without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download exact proposal receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.proposal.outputs.artifact_name }}
          path: ${{ runner.temp }}/proposal

      - name: Create or reuse deterministic metadata-only proposal branch and pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Tools/github_catalog_proposal.py \
            --receipt "$RUNNER_TEMP/proposal/payload/production-catalog-release-input.json" \
            --proposal-report "$RUNNER_TEMP/proposal/payload/proposal-report.json" \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref main \
            --base-sha "$GITHUB_SHA"
